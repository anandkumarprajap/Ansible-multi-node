- name: Install common packages
  hosts: servers
  become: true

  tasks:
    - name: Update Packages
      apt:
          update_cache: true

    - name: Install unzip
      apt:
          name: unzip
          state: present
    - name: Install Docker
      apt:
          name: docker.io
          state: present
    - name: Install docker compose
      apt:
          name: docker-compose-v2
          state: present
    - name: Add user to docker group
      user:
          name: ubuntu
          groups: docker
          append: yes
